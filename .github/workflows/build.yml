name: Build

# 모든 push 에서 윈도우 기본 컴파일러로 빌드를 확인한다.
# 기본 브랜치에 push 했을 때 src/AssemblyInfo.cs 의 버전(vX.Y.Z) 릴리스가 아직 없으면,
# 그 태그로 GitHub Release 를 만들고 PlayTimer.zip 을 올린다. (v* 태그를 직접 push 해도 된다)
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build PlayTimer.exe
        shell: cmd
        run: call build.bat

      - name: Package
        shell: pwsh
        run: |
          $out = 'dist/PlayTimer'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item PlayTimer.exe, config.ini, install.bat, install.ps1, uninstall.bat, uninstall.ps1, README.md $out
          Compress-Archive -Path "$out/*" -DestinationPath dist/PlayTimer.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: PlayTimer
          path: dist/PlayTimer

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path src/AssemblyInfo.cs -Pattern 'AssemblyVersion\("(\d+\.\d+\.\d+)').Matches[0].Groups[1].Value
          "tag=v$v" >> $env:GITHUB_OUTPUT
          git ls-remote --exit-code --tags origin "refs/tags/v$v" *> $null
          "exists=$(if ($LASTEXITCODE -eq 0) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          $global:LASTEXITCODE = 0

      - name: Publish release (new version on default branch)
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: PlayTimer ${{ steps.ver.outputs.tag }}
          files: dist/PlayTimer.zip
          generate_release_notes: true

      - name: Publish release (pushed tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PlayTimer.zip
          generate_release_notes: true
