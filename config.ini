# PlayTimer 설정 (수정 후 타이머를 다시 실행하면 적용됩니다)

# 요일별 총량과 허용 시간대는 트레이 아이콘을 더블클릭해서 여는 "시간 설정" 창에서 정합니다.
# 아래 값은 시간 설정을 한 번도 저장하지 않았을 때 쓰는 요일 공통 기본 총량(분)입니다.
DailyLimitMinutes=180

# 하루가 바뀌는 시각(시). 4면 새벽 4시까지는 전날로 칩니다.
ResetHour=4

# 남은 시간(총량이나 허용 시간대 중 먼저 끝나는 쪽)이 이만큼(분)일 때 미리 경고
WarnAtMinutes=10,5,1

# 시간 초과 후 단계 전환 시점(분)
#  1단계: 작은 팝업 / 2단계: 큰 빨간 팝업, 잠시 못 닫음 / 3단계: 전체화면 덮기
Stage2AfterMinutes=10
Stage3AfterMinutes=20

# 팝업을 닫은 뒤 다시 뜨기까지 간격(초)
Stage1NagSeconds=120
Stage2NagSeconds=60
Stage3NagSeconds=60

# 닫기 버튼이 활성화되기까지 기다려야 하는 시간(초)
Stage2CloseDelaySeconds=10
Stage3CloseDelaySeconds=20

# 연장: 한 번에 몇 분, 하루 몇 번 (0이면 연장 불가)
ExtensionMinutes=30
MaxExtensionsPerDay=1
